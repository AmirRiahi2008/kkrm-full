server {
    listen 80;
    server_name api.kkrm.ir;
    return 301 https://api.kkrm.ir$request_uri;
}

server {
    listen 443 ssl;
    server_name api.kkrm.ir;
    root /var/www/kkrm-backend/public;
    ssl_certificate /etc/letsencrypt/live/api.kkrm.ir/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.kkrm.ir/privkey.pem;
    index index.php;
    charset utf-8;
    client_max_body_size 55m;
    server_tokens off;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /index.php {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root/index.php;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
    }

    location ~ \.php$ {
        return 404;
    }

    location ~ /\. {
        deny all;
    }
}
